baseURL: https://marcowky.github.io/
languageCode: en-us
title: Marco's Nonsense
theme: ["PaperMod"]
pagination.pagerSize: 10

outputs:
  home:
    - HTML
    - RSS
    - JSON

taxonomies:
  tag: tags

params:
  mainSections:
    - posts
  homeReadme:
    remote: "https://raw.githubusercontent.com/Marcowky/Marcowky/main/README.md"
    localPath: "external/Marcowky/README.md"

menu:
  main:
    - name: Posts
      url: /posts/
      weight: 10
    - name: Archive
      url: /archives/
      weight: 20
    - name: Search
      url: /search/
      weight: 30
    - name: Tags
      url: /tags/
      weight: 40

markup:
  goldmark:
    renderer:
      unsafe: true