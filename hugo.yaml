# hugo server --ignoreCache

baseURL: https://marcowky.github.io/
languageCode: en-us
title: Marco's Nonsense
theme: ["PaperMod"]
pagination.pagerSize: 5

outputs:
  home:
    - HTML
    - RSS
    - JSON

taxonomies:
  tag: tags

params:
  keywords:
    - "Kaiyu Wu"
    - "Wu Kaiyu"
    - "伍开钰"
    - "Marco"
    - "Marcowky"
  assets:
    favicon: "favicon.svg"
    favicon16x16: "favicon.svg"
    favicon32x32: "favicon.svg"
    apple_touch_icon: "favicon.svg"
    safari_pinned_tab: "favicon.svg"
  mainSections:
    - posts
  DateFormat: "January 2, 2006"
  # ShowReadingTime: true
  author: "Kaiyu Wu"
  ShowToc: true
  # Front matter keys to hide in the Properties block.
  propertiesHide: ["lastmod"]
  homeReadme:
    remote: "https://raw.githubusercontent.com/Marcowky/Marcowky/main/README.md"
    localPath: "external/Marcowky/README.md"

menu:
  main:
    - name: Posts
      url: /posts/
      weight: 10
    - name: Archive
      url: /archives/
      weight: 20
    - name: Search
      url: /search/
      weight: 30
    - name: Tags
      url: /tags/
      weight: 40

markup:
  goldmark:
    renderer:
      unsafe: true
